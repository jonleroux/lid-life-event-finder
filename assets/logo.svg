<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Red circle background -->
  <circle cx="100" cy="100" r="100" fill="#e02020"/>

  <!-- V-twin engine icon, white -->
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Left cylinder (tilted left ~20deg) -->
    <!-- Cylinder body -->
    <rect x="52" y="28" width="34" height="52" rx="5" ry="5" fill="white" stroke="none" transform="rotate(-15 69 54)"/>
    <!-- Fins on left cylinder -->
    <line x1="46" y1="46" x2="76" y2="38" stroke="#e02020" stroke-width="3"/>
    <line x1="44" y1="54" x2="74" y2="46" stroke="#e02020" stroke-width="3"/>
    <line x1="43" y1="62" x2="73" y2="54" stroke="#e02020" stroke-width="3"/>
    <line x1="42" y1="70" x2="72" y2="62" stroke="#e02020" stroke-width="3"/>
    <!-- Left cylinder head (darker top cap) -->
    <rect x="52" y="24" width="34" height="12" rx="4" ry="4" fill="#c01010" stroke="none" transform="rotate(-15 69 30)"/>

    <!-- Right cylinder (tilted right ~20deg) -->
    <rect x="114" y="28" width="34" height="52" rx="5" ry="5" fill="white" stroke="none" transform="rotate(15 131 54)"/>
    <!-- Fins on right cylinder -->
    <line x1="124" y1="38" x2="154" y2="46" stroke="#e02020" stroke-width="3"/>
    <line x1="126" y1="46" x2="156" y2="54" stroke="#e02020" stroke-width="3"/>
    <line x1="127" y1="54" x2="157" y2="62" stroke="#e02020" stroke-width="3"/>
    <line x1="128" y1="62" x2="158" y2="70" stroke="#e02020" stroke-width="3"/>
    <!-- Right cylinder head -->
    <rect x="114" y="24" width="34" height="12" rx="4" ry="4" fill="#c01010" stroke="none" transform="rotate(15 131 30)"/>

    <!-- Crankcase / engine block base -->
    <ellipse cx="100" cy="130" rx="46" ry="30" fill="white" stroke="none"/>
    <!-- Crankcase detail -->
    <ellipse cx="100" cy="130" rx="30" ry="19" fill="#e02020" stroke="none"/>
    <!-- Center circle (flywheel) -->
    <circle cx="100" cy="130" r="17" fill="white" stroke="none"/>
    <circle cx="100" cy="130" r="9" fill="#e02020" stroke="none"/>
    <circle cx="100" cy="130" r="4" fill="white" stroke="none"/>

    <!-- Connector rods from cylinders to crankcase -->
    <polygon points="72,78 84,78 95,110 83,114" fill="white" stroke="none" transform="rotate(-8 83 96)"/>
    <polygon points="116,78 128,78 117,110 105,114" fill="white" stroke="none" transform="rotate(8 117 96)"/>

  </g>
</svg>
